{% extends 'animals/base.html' %}

{% block title %}Login{% endblock %}
{% block heading %}Login{% endblock %}

{% block content %}

<div class="max-w-md mx-auto">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">

        <!-- Header -->
        <div class="bg-emerald-800 px-6 py-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center">
                <span class="material-symbols-outlined text-white">login</span>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white">Welcome Back</h2>
                <p class="text-emerald-200 text-sm">Login to your account</p>
            </div>
        </div>

        <!-- Form -->
        <div class="p-6">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit"
                        class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-emerald-800 text-white font-bold rounded-lg hover:bg-emerald-700 transition-all mt-2">
                    <span class="material-symbols-outlined text-sm">login</span>
                    Log In
                </button>
            </form>

            <p class="text-center text-sm text-gray-400 mt-4">
                Don't have an account?
                <a href="{% url 'animals:signup' %}" class="text-emerald-700 font-bold hover:underline">Sign up</a>
            </p>
        </div>

    </div>
</div>

{% endblock %}
